<style>
:root {
  --bg:#f5f7fb; --card:#fff; --text:#132033; --muted:#64748b; --line:#dbe5f2;
  --blue:#2563eb; --blue2:#dbeafe; --green:#16a34a; --green2:#dcfce7;
  --red:#dc2626; --red2:#fee2e2; --amber:#f59e0b; --amber2:#fef3c7;
  --purple:#7c3aed; --purple2:#ede9fe; --shadow:0 12px 30px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f8fbff 0%,var(--bg) 100%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.55}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:#0f172a;color:#e5e7eb;padding:16px;border-right:1px solid #111827}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.mark{width:42px;height:42px;border-radius:16px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:grid;place-items:center;color:white;font-weight:950}
.logo h1{font-size:18px;margin:0}.logo p{margin:2px 0 0;color:#94a3b8;font-size:12px}
.group{margin:14px 0}
.group-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin:10px 0 6px}
.tree-btn{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:#e5e7eb;border-radius:12px;padding:9px 10px;cursor:pointer;font-weight:750;margin:2px 0}
.tree-btn:hover{background:#1e293b}.tree-btn.active{background:#dbeafe;color:#1d4ed8}
.main{padding:18px;max-width:1180px;width:100%;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h2{margin:0 0 8px}.sub{color:var(--muted);font-size:13px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,#eff6ff,#f5f3ff)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.item,.stat{background:#fbfdff;border:1px solid var(--line);border-radius:20px;padding:15px}
.stat b{font-size:25px}
.pill{display:inline-block;background:var(--blue2);color:var(--blue);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:900;margin:2px}
.ready{background:var(--green2);color:#166534}.lock{background:var(--red2);color:#991b1b}.warn{background:var(--amber2);color:#92400e}.purple{background:var(--purple2);color:#5b21b6}
.ok{color:var(--green);font-weight:900}.bad{color:var(--red);font-weight:900}
.flow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#0f172a;color:#e5e7eb;border-radius:18px;padding:14px;overflow:auto;white-space:pre-wrap}
code{background:#f1f5f9;border-radius:7px;padding:2px 5px}
.mobile-title{display:none}
@media(max-width:850px){
  .app{grid-template-columns:1fr}
  .sidebar{position:relative;height:auto;max-height:45vh}
  .main{padding:12px}
  .mobile-title{display:block}
}
</style>

      </div>
    </div>
    <div id="tree"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h2 id="sectionTitle">Dashboard</h2>
        <p id="sectionSub" class="sub">ODIN control-center</p>
      </div>
      <span class="pill ready">READY FOR REVIEW</span>
    </div>
    <section class="card hero">
      <span class="pill">ODIN v3</span><span class="pill">SIDEBAR TREE</span><span class="pill">ALL LAYERS</span>
      <p><span class="ok">PASS:</span> Верхнє меню замінено на масштабоване дерево зліва.</p>
    </section>
    <section class="card">
      <h2 id="contentTitle"></h2>
      <span id="contentStatus" class="pill"></span>
      <p id="contentBody"></p>
      <div id="contentFlow" class="flow" style="display:none"></div>
    </section>
    <section class="card">
      <h2>Details</h2>
      <div id="details" class="grid"></div>
    </section>
    <section class="card">
      <h2>GitHub update</h2>
      <p>Для GitHub: завантажити цей HTML як <code>index.html</code>.</p>
      <p>Commit: <code>ODIN v3 update: sidebar tree architecture</code></p>
    </section>
  </main>

<script>
const MODEL = JSON.parse(document.getElementById('ODIN_INTERFACE_V3_MODEL').textContent);
const SECTIONS = JSON.parse(document.getElementById('ODIN_SECTIONS').textContent);

function renderTree(){
  const tree = document.getElementById('tree');
  tree.innerHTML = MODEL.tree.map(group => `
    <div class="group">
      <div class="group-title">${group.group}</div>
      ${group.items.map(item => `<button class="tree-btn" data-id="${item.id}" onclick="showSection('${item.id}')">${item.title}</button>`).join('')}
    </div>
  `).join('');
}

function showSection(id){
  const s = SECTIONS[id] || SECTIONS.dashboard;
  document.querySelectorAll('.tree-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.id === id));
  document.getElementById('sectionTitle').textContent = s.title;
  document.getElementById('sectionSub').textContent = s.status;
  document.getElementById('contentTitle').textContent = s.title;
  const st = document.getElementById('contentStatus');
  st.textContent = s.status;
  st.className = 'pill ' + (s.status.includes('LOCK') || s.status.includes('FIXED') ? 'ready' : s.status.includes('NEEDED') ? 'warn' : 'purple');
  document.getElementById('contentBody').textContent = s.body;
  const flow = document.getElementById('contentFlow');
  if(s.body.includes('→') || s.title.includes('Architecture') || s.title.includes('Link')) {
    flow.style.display = 'block';
    flow.textContent = s.body;
  } else {
    flow.style.display = 'none';
  }
  document.getElementById('details').innerHTML = (s.points || []).map(p => `<div class="item"><span class="pill ready">ITEM</span><p>${p}</p></div>`).join('');
}

renderTree();
showSection('dashboard');
</script>
