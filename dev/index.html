<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ODIN v3.8.1 QA SYSTEM 100 SPLIT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <div class="badge">ODIN v3.8.1</div>
      <h1>QA SYSTEM 100 — SPLIT VERSION</h1>
      <p class="muted">HTML, CSS і JavaScript розділені. Це прибирає ризик появи JS-коду внизу сторінки.</p>
    </section>

    <section class="grid">
      <div class="panel">
        <h2>Lesson Input</h2>

        <label for="title">Назва уроку</label>
        <input id="title" value="Відокремлювані дієслова">

        <label for="goal">Ціль уроку</label>
        <textarea id="goal">Зрозуміти правило відокремлюваних дієслів, порядок слів і різницю між дослівним та смисловим перекладом.</textarea>

        <label for="examples">Приклади: DE | ДП | СД</label>
        <textarea id="examples">Ich stehe um sechs Uhr auf.|Я встаю о шостій годині вгору.|Я встаю о шостій годині.
Mach die Tür zu!|Зроби двері до!|Закрий двері!
Wir kaufen heute ein.|Ми купуємо сьогодні всередину.|Ми сьогодні закуповуємось.</textarea>

        <label for="vocab">Словник: DE | UA</label>
        <textarea id="vocab">aufstehen|вставати
zumachen|закривати
einkaufen|закуповуватись</textarea>

        <button id="runBtn" type="button">Створити урок</button>
        <button id="clearBtn" class="secondary" type="button">Очистити</button>
      </div>

      <div class="panel">
        <h2>Status</h2>
        <pre id="log">WAITING</pre>

        <h2>QA Checklist</h2>
        <div id="qaBox"><p class="muted">QA зʼявиться після запуску.</p></div>

        <h2>Export</h2>
        <div id="download"></div>
      </div>
    </section>

    <section class="panel">
      <h2>Preview</h2>
      <iframe id="preview" title="Lesson preview"></iframe>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
