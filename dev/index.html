<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODIN v3.7.2 CLEAN</title>
<style>
body{font-family:system-ui;background:#111;color:#fff;padding:20px}
button{padding:10px 15px;border-radius:8px;border:0;background:#38bdf8;color:#000;font-weight:700;cursor:pointer}
textarea,input{width:100%;margin-top:10px;padding:10px;border-radius:8px;border:1px solid #444;background:#000;color:#fff}
.panel{background:#222;padding:15px;border-radius:12px;margin-bottom:15px}
</style>
</head>

<body>

<h1>ODIN v3.7.2 CLEAN</h1>

<div class="panel">
<input id="title" value="Відокремлювані дієслова">
<textarea id="examples">
Ich stehe um sechs Uhr auf.|Я встаю о 6.|Я встаю о 6.
Mach die Tür zu!|Зроби двері до.|Закрий двері!
</textarea>

<button onclick="run()">Створити урок</button>
</div>

<div class="panel">
<pre id="log"></pre>
</div>

<div class="panel">
<iframe id="preview" style="width:100%;height:400px;background:#fff"></iframe>
</div>

<script>
function run(){
    log("RUNNING")

    const title=document.getElementById("title").value
    const raw=document.getElementById("examples").value

    const examples=raw.split("\n").map(l=>l.split("|"))

    let html="<h1>"+title+"</h1>"

    examples.forEach(e=>{
        html+="<p><b>"+e[0]+"</b><br>"+e[1]+"<br>"+e[2]+"</p>"
    })

    document.getElementById("preview").srcdoc=html

    log("DONE")
}

function log(msg){
    document.getElementById("log").textContent+=msg+"\\n"
}
</script>

</body>
</html>
