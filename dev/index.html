<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ODIN v3.9.1 UI CONTROL FIX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <div class="badge">ODIN v3.9.1 FIX</div>
      <h1>UI CONTROL SYSTEM</h1>
      <p class="muted">FIX: кнопки підключені через app.js і addEventListener.</p>

      <button id="createLessonBtn" type="button">Створити урок</button>

      <div class="controls">
        <button id="toggleDpBtn" type="button">Показати/Сховати ДП</button>
        <button id="toggleSdBtn" type="button">Показати/Сховати СД</button>
        <button id="modeDeBtn" type="button">Тільки DE</button>
        <button id="modeFullBtn" type="button">Повний режим</button>
      </div>
    </section>

    <section class="panel">
      <h2>Status</h2>
      <pre id="log">WAITING</pre>
    </section>

    <section class="panel">
      <h2>Preview</h2>
      <iframe id="preview" title="Lesson preview"></iframe>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
