<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>ODIN v3.7.3 PRO</title>
</head>
<body>
<h1>ODIN v3.7.3 PRO</h1>
<button onclick="run()">Створити урок</button>
<pre id="log"></pre>
<iframe id="preview" style="width:100%;height:300px;"></iframe>
<div id="download"></div>

<script>
function run(){
log("RUNNING")
let html="<h1>Test Lesson</h1><p>OK</p><h2>QA marker</h2>"
document.getElementById("preview").srcdoc=html
log("LESSON_DONE")

if(html.includes("QA marker")){
 log("QA_PASSED")
}else{
 log("QA_FAILED")
 return
}

const blob=new Blob([html],{type:"text/html"})
const url=URL.createObjectURL(blob)

document.getElementById("download").innerHTML=
'<a href="'+url+'" download="lesson.html">Завантажити урок</a>'

log("DONE")
}

function log(t){
document.getElementById("log").textContent+=t+"\n"
}
</script>
</body>
</html>
