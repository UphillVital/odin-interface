<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>ODIN V02.10 File Actions</title>
<style>
body{display:flex;font-family:Arial,system-ui,sans-serif;margin:0;background:#f5f7fb;color:#132033}
#tree{width:32%;height:100vh;overflow:auto;background:#0f172a;color:#e5e7eb;padding:12px}
#viewer{width:68%;height:100vh;overflow:auto;padding:16px}
.group{font-weight:800;color:#93c5fd;margin:14px 0 6px}
.file{cursor:pointer;margin:4px 0;padding:7px 9px;border-radius:10px}
.file:hover{background:#1e293b}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
button{border:0;background:#111827;color:white;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer}
.blue{background:#2563eb}.green{background:#16a34a}.amber{background:#f59e0b;color:#111827}
pre{background:#0b1220;color:#e5e7eb;border-radius:14px;padding:14px;overflow:auto;white-space:pre-wrap;max-height:62vh}
.card{background:white;border:1px solid #dbe5f2;border-radius:16px;padding:12px;margin:10px 0}
</style>
</head>
<body>
<div id="tree"></div>
<div id="viewer"><h1>ODIN File Viewer + Actions</h1><p>Вибери файл зліва.</p></div>
<script src="odin_tree_data.js"></script>
<script src="viewer.js"></script>
</body>
</html>
