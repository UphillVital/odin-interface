<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ODIN — Commit Builder</title>
  <link rel="stylesheet" href="odin_global_matrix.css" />
</head>
<body data-page="commit" data-theme="light">
  <section data-odin-content>
    <div class="odin-card">
      <h2>Commit Builder</h2>
      <p class="odin-note">Генератор повної фіксації ODIN: commit, push, tag, changelog. Це запасний інструмент, який використовується за потреби.</p>
    </div>
    <div class="odin-card">
      <label>Версія</label><br />
      <input id="version" value="V03.27.2" style="width:100%;padding:10px;border-radius:12px;border:1px solid var(--odin-border);box-sizing:border-box;" />
      <br /><br />
      <label>Назва фіксації</label><br />
      <input id="title" value="Global ODIN UI Matrix Restore" style="width:100%;padding:10px;border-radius:12px;border:1px solid var(--odin-border);box-sizing:border-box;" />
      <br /><br />
      <button class="odin-nav-btn" type="button" onclick="generateCommit()">Згенерувати</button>
    </div>
    <div class="odin-card">
      <h3>Результат</h3>
      <pre id="commitOutput" style="white-space:pre-wrap;line-height:1.5;"></pre>
    </div>
  </section>
  <script src="odin_global_matrix.js"></script>
  <script>
    function generateCommit(){
      const v=document.getElementById('version').value.trim();
      const title=document.getElementById('title').value.trim();
      document.getElementById('commitOutput').textContent=`git add dev/V03/\ngit commit -m "ODIN ${v} — ${title}.\n\n✔ Що зроблено:\n- Описати виконані зміни.\n\n✔ Що це дає:\n- Описати результат для системи.\n\n✔ Контекст:\n- Описати причину фіксації.\n"\ngit push origin feature/odin-interface-v03\ngit tag -a ${v.replace(/\s+/g,'-').replace(/\./g,'.')}-CHECKPOINT -m "ODIN ${v} — ${title}"\ngit push origin ${v.replace(/\s+/g,'-').replace(/\./g,'.')}-CHECKPOINT`;
    }
  </script>
</body>
</html>
