<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ODIN Interface V03 — Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-light" data-lang="ua" data-theme="light">
  <header class="odin-header">
    <div class="brand">
      <div class="brand-mark">ODIN</div>
      <div>
        <div class="brand-title" data-i18n="title"></div>
        <div class="brand-subtitle" data-i18n="subtitle"></div>
      </div>
    </div>

    <div class="header-actions">
      <div class="quick-settings" id="quickSettings">
        <button class="settings-button" id="settingsToggle" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="settings-icon" aria-hidden="true">⚙</span>
          <span class="sr-only" data-i18n="settings"></span>
        </button>
        <div class="settings-menu" id="settingsMenu" hidden>
          <div class="settings-menu-title" data-i18n="quickSettings"></div>
          <button class="settings-row" id="themeToggle" type="button">
            <span data-i18n="themeLabel"></span>
            <strong id="themeValue"></strong>
          </button>
          <div class="settings-row settings-language-row">
            <span data-i18n="languageLabel"></span>
            <div class="language-switch" id="languageSwitch" role="group" aria-label="Language selection">
              <button class="language-pill" type="button" data-lang-option="ua">UA</button>
              <button class="language-pill" type="button" data-lang-option="en">EN</button>
              <button class="language-pill" type="button" data-lang-option="de">DE</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="odin-shell">
    <aside class="left-tree">
      <div class="tree-title">
        <span data-i18n="treeTitle"></span>
        <span class="hint" tabindex="0" data-help-key="hintTree">?</span>
      </div>
      <button class="tree-item active" data-zone="command"><span data-i18n="zoneCommand"></span><span class="hint" tabindex="0" data-help-key="hintCommand">?</span></button>
      <button class="tree-item" data-zone="map"><span data-i18n="zoneMap"></span><span class="hint" tabindex="0" data-help-key="hintMap">?</span></button>
      <button class="tree-item" data-zone="projects"><span data-i18n="zoneProjects"></span><span class="hint" tabindex="0" data-help-key="hintProjects">?</span></button>
      <button class="tree-item" data-zone="files"><span data-i18n="zoneFiles"></span><span class="hint" tabindex="0" data-help-key="hintFiles">?</span></button>
      <button class="tree-item" data-zone="manual"><span data-i18n="zoneManual"></span><span class="hint" tabindex="0" data-help-key="hintManual">?</span></button>
    </aside>

    <main class="work-zone" id="workZone" aria-live="polite"></main>

    <aside class="assist-panel">
      <div class="assist-title">
        <span data-i18n="assistTitle"></span>
        <span class="hint" tabindex="0" data-help-key="hintAssist">?</span>
      </div>
      <div id="assistContent" class="assist-content"></div>
    </aside>
  </div>

  <footer class="status-bar">
    <span><span data-i18n="modeLabel"></span>: <strong id="modeValue"></strong></span>
    <span><span data-i18n="stateLabel"></span>: <strong id="stateValue"></strong></span>
    <span><span data-i18n="projectLabel"></span>: <strong id="projectValue"></strong></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
