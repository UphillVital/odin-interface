<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ODIN Interface V03 — System Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-light">
  <header class="odin-header">
    <div class="brand">
      <div class="brand-mark">ODIN</div>
      <div>
        <div class="brand-title" data-i18n="title">Інтерфейс ОДІН V03</div>
        <div class="brand-subtitle" data-i18n="subtitle">Робоче середовище керування системою</div>
      </div>
    </div>

    <button class="master-start" id="masterStart" data-i18n="masterStart">ODIN SYSTEM — MASTER START</button>

    <div class="top-controls">
      <button class="small-btn" id="themeToggle">Dark</button>
      <button class="small-btn" id="langToggle">EN</button>
    </div>
  </header>

  <div class="odin-shell">
    <aside class="left-tree">
      <div class="tree-title" data-i18n="treeTitle">Жива карта</div>
      <button class="tree-item active" data-zone="command" data-help="commandHelp">Command Center</button>
      <button class="tree-item" data-zone="map" data-help="mapHelp">System Map</button>
      <button class="tree-item" data-zone="files" data-help="filesHelp">File Workspace</button>
      <button class="tree-item" data-zone="ois" data-help="oisHelp">OIS Core</button>
      <button class="tree-item" data-zone="manual" data-help="manualHelp">Manual / Help</button>
    </aside>

    <main class="work-zone" id="workZone"></main>

    <aside class="assist-panel">
      <div class="assist-title" data-i18n="assistTitle">Assisted Mode</div>
      <div id="assistText" class="assist-text"></div>
      <button class="hint-btn" id="explainBtn" data-i18n="explainBtn">Пояснити цю зону</button>
    </aside>
  </div>

  <div class="modal hidden" id="modal">
    <div class="modal-card">
      <button class="modal-close" id="modalClose">×</button>
      <h3 id="modalTitle"></h3>
      <p id="modalText"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
