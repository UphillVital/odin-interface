<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ODIN Interface V03 — System Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-light" data-lang="uk">
  <header class="odin-header">
    <div class="brand">
      <div class="brand-mark">ODIN</div>
      <div>
        <div class="brand-title" data-i18n="brandTitle">ODIN Interface V03</div>
        <div class="brand-subtitle" data-i18n="brandSubtitle">Робоче середовище керування системою</div>
      </div>
    </div>

    <div class="header-actions">
      <button class="primary-action" id="masterStart" data-i18n="masterStart">ODIN SYSTEM — MASTER START</button>

      <div class="segmented" aria-label="Language switch">
        <button id="langUk" class="active">UA</button>
        <button id="langEn">EN</button>
      </div>

      <div class="segmented" aria-label="Theme switch">
        <button id="themeLight" class="active" data-i18n="light">Світла</button>
        <button id="themeDark" data-i18n="dark">Темна</button>
      </div>
    </div>
  </header>

  <div class="status-strip">
    <div><span data-i18n="mode">Режим</span>: <strong id="modeValue">DISCUSSION</strong></div>
    <div><span data-i18n="state">Стан</span>: <strong id="stateValue">READY</strong></div>
    <div><span data-i18n="activeZone">Активна зона</span>: <strong id="zoneValue">COMMAND_CENTER</strong></div>
  </div>

  <div class="layout">
    <aside class="left-tree">
      <div class="tree-title" data-i18n="navigation">Навігація ODIN</div>

      <button class="tree-item active" data-zone="command">
        <span data-i18n="zoneCommand">Command Center</span>
        <span class="hint-dot" data-help="command"></span>
      </button>

      <button class="tree-item" data-zone="map">
        <span data-i18n="zoneMap">System Map</span>
        <span class="hint-dot" data-help="map"></span>
      </button>

      <button class="tree-item" data-zone="files">
        <span data-i18n="zoneFiles">File Workspace</span>
        <span class="hint-dot" data-help="files"></span>
      </button>

      <button class="tree-item" data-zone="manual">
        <span data-i18n="zoneManual">Manual / Help</span>
        <span class="hint-dot" data-help="manual"></span>
      </button>

      <div class="tree-footer">
        <button id="openHelp" class="soft-button" data-i18n="howUse">Як користуватись?</button>
      </div>
    </aside>

    <main class="work-zone" id="workZone"></main>

    <aside class="assist-panel">
      <div class="assist-title" data-i18n="assistTitle">Assisted Mode</div>
      <p id="assistText" data-i18n="assistIntro">
        ODIN підказує наступний крок, пояснює звʼязки та допомагає не губитися.
      </p>
      <button class="soft-button" id="explainCurrent" data-i18n="explainCurrent">Пояснити поточну зону</button>
    </aside>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button class="modal-close" id="closeModal">×</button>
      <h2 id="modalTitle"></h2>
      <p id="modalBody"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
