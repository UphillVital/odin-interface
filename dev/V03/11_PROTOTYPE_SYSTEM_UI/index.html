<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ODIN Interface V03 Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="theme-light" data-lang="ua" data-theme="light">
    <header class="odin-header">
      <div class="brand">
        <div class="brand-mark">ODIN</div>
        <div>
          <div class="brand-title" data-i18n="title"></div>
          <div class="brand-subtitle" data-i18n="subtitle"></div>
        </div>
      </div>

      <div class="header-actions">
        <div class="quick-settings" id="quickSettings">
          <button
            class="settings-button"
            id="settingsToggle"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
          >
            <span class="settings-icon" aria-hidden="true">⚙</span>
            <span class="sr-only" data-i18n="settings"></span>
          </button>
          <div class="settings-menu" id="settingsMenu" hidden>
            <div class="settings-menu-title" data-i18n="quickSettings"></div>
            <div class="settings-section">
              <div class="settings-section-label" data-i18n="systemPages"></div>
              <a
                class="settings-link"
                href="index.html"
                data-i18n="mainInterface"
              ></a>
              <a
                class="settings-link"
                href="#controlCenter"
                data-zone-jump="controlCenter"
                data-i18n="controlCenter"
              ></a>
              <a
                class="settings-link"
                href="#commitBuilder" data-zone-jump="commitBuilder"
                data-i18n="commitBuilder"
              ></a>
              <a
                class="settings-link"
                href="#stateWorkspace" data-zone-jump="stateWorkspace"
                data-i18n="stateWorkspace"
              ></a>
            </div>
            <button class="settings-row" id="themeToggle" type="button">
              <span data-i18n="themeLabel"></span>
              <strong id="themeValue"></strong>
            </button>
            <div class="settings-row settings-language-row">
              <span data-i18n="languageLabel"></span>
              <div
                class="language-switch"
                id="languageSwitch"
                role="group"
                aria-label="Language selection"
              >
                <button
                  class="language-pill"
                  type="button"
                  data-lang-option="ua"
                >
                  UA
                </button>
                <button
                  class="language-pill"
                  type="button"
                  data-lang-option="en"
                >
                  EN
                </button>
                <button
                  class="language-pill"
                  type="button"
                  data-lang-option="de"
                >
                  DE
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="odin-shell">
      <aside class="left-tree">
        <div class="tree-title">
          <span data-i18n="treeTitle"></span>
          <span class="hint" tabindex="0" data-help-key="hintTree">?</span>
        </div>
        <button class="tree-item active" data-zone="command">
          <span data-i18n="zoneCommand"></span
          ><span class="hint" tabindex="0" data-help-key="hintCommand">?</span>
        </button>
        <button class="tree-item" data-zone="map">
          <span data-i18n="zoneMap"></span
          ><span class="hint" tabindex="0" data-help-key="hintMap">?</span>
        </button>
        <button class="tree-item" data-zone="v04plan">
          <span data-i18n="zoneV04Plan"></span
          ><span class="hint" tabindex="0" data-help-key="hintV04Plan">?</span>
        </button>
        <button class="tree-item" data-zone="foundation">
          <span data-i18n="zoneFoundation"></span
          ><span class="hint" tabindex="0" data-help-key="hintFoundation">?</span>
        </button>
        <button class="tree-item" data-zone="capabilities">
          <span data-i18n="zoneCapabilities"></span
          ><span class="hint" tabindex="0" data-help-key="hintCapabilities">?</span>
        </button>
        <button class="tree-item" data-zone="controlCenter">
          <span data-i18n="zoneControlCenter"></span
          ><span class="hint" tabindex="0" data-help-key="hintControlCenter">?</span>
        </button>
        <button class="tree-item" data-zone="migrationPlan">
          <span data-i18n="zoneMigrationPlan"></span
          ><span class="hint" tabindex="0" data-help-key="hintMigrationPlan">?</span>
        </button>
        <button class="tree-item" data-zone="commitBuilder">
          <span data-i18n="zoneCommitBuilder"></span
          ><span class="hint" tabindex="0" data-help-key="hintCommitBuilder">?</span>
        </button>
        <button class="tree-item" data-zone="stateWorkspace">
          <span data-i18n="zoneStateWorkspace"></span
          ><span class="hint" tabindex="0" data-help-key="hintStateWorkspace">?</span>
        </button>
        <button class="tree-item" data-zone="realStateEngine">
          <span data-i18n="zoneRealStateEngine"></span
          ><span class="hint" tabindex="0" data-help-key="hintRealStateEngine">?</span>
        </button>
        <button class="tree-item" data-zone="executionEngine">
          <span data-i18n="zoneExecutionEngine"></span
          ><span class="hint" tabindex="0" data-help-key="hintExecutionEngine">?</span>
        </button>
        <button class="tree-item" data-zone="runtimeGraph">
          <span data-i18n="zoneRuntimeGraph"></span
          ><span class="hint" tabindex="0" data-help-key="hintRuntimeGraph">?</span>
        </button>
        <button class="tree-item" data-zone="recoveryReplay">
          <span data-i18n="zoneRecoveryReplay"></span
          ><span class="hint" tabindex="0" data-help-key="hintRecoveryReplay">?</span>
        </button>
        <button class="tree-item" data-zone="autonomousLoop">
          <span data-i18n="zoneAutonomousLoop"></span
          ><span class="hint" tabindex="0" data-help-key="hintAutonomousLoop">?</span>
        </button>
        <button class="tree-item" data-zone="observerSystem">
          <span data-i18n="zoneObserverSystem"></span
          ><span class="hint" tabindex="0" data-help-key="hintObserverSystem">?</span>
        </button>
        <button class="tree-item" data-zone="eventBus">
          <span data-i18n="zoneEventBus"></span
          ><span class="hint" tabindex="0" data-help-key="hintEventBus">?</span>
        </button>
        <button class="tree-item" data-zone="liveStateDb">
          <span data-i18n="zoneLiveStateDb"></span
          ><span class="hint" tabindex="0" data-help-key="hintLiveStateDb">?</span>
        </button>
        <button class="tree-item" data-zone="runtimeCore">
          <span data-i18n="zoneRuntimeCore"></span
          ><span class="hint" tabindex="0" data-help-key="hintRuntimeCore">?</span>
        </button>
        <button class="tree-item" data-zone="runtimeQaLock">
          <span data-i18n="zoneRuntimeQaLock"></span
          ><span class="hint" tabindex="0" data-help-key="hintRuntimeQaLock">?</span>
        </button>
        <button class="tree-item" data-zone="projects">
          <span data-i18n="zoneProjects"></span
          ><span class="hint" tabindex="0" data-help-key="hintProjects">?</span>
        </button>
        <button class="tree-item" data-zone="files">
          <span data-i18n="zoneFiles"></span
          ><span class="hint" tabindex="0" data-help-key="hintFiles">?</span>
        </button>
        <button class="tree-item" data-zone="manual">
          <span data-i18n="zoneManual"></span
          ><span class="hint" tabindex="0" data-help-key="hintManual">?</span>
        </button>
      </aside>

      <main class="work-zone" id="workZone" aria-live="polite"></main>

      <aside class="assist-panel">
        <div class="assist-title">
          <span data-i18n="assistTitle"></span>
          <span class="hint" tabindex="0" data-help-key="hintAssist">?</span>
        </div>
        <div id="assistContent" class="assist-content"></div>
      </aside>
    </div>

    <footer class="status-bar">
      <span
        ><span data-i18n="modeLabel"></span>: <strong id="modeValue"></strong
      ></span>
      <span
        ><span data-i18n="stateLabel"></span>: <strong id="stateValue"></strong
      ></span>
      <span
        ><span data-i18n="projectLabel"></span>:
        <strong id="projectValue"></strong
      ></span>
      <span
        ><span data-i18n="workflowLabel"></span>:
        <strong id="workflowValue"></strong
      ></span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
