<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ODIN V03.121 — Unified Data Model Schema</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f6f8fb;color:#111827}
header{padding:20px 28px;background:white;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
main{padding:24px;display:grid;gap:16px}
.zone-card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(15,23,42,.06)}
.zone-title{margin:0 0 8px;font-size:20px}
.record-actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.record-action{border:1px solid #cbd5e1;background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}
.system-panel, textarea{width:100%;box-sizing:border-box;border:1px solid #e5e7eb;border-radius:14px;background:#f8fafc;padding:14px;margin-top:10px}
textarea{min-height:300px;font-family:ui-monospace,Consolas,monospace}
.badge{padding:6px 10px;border-radius:999px;background:#eef2ff}
</style>
</head>
<body>
<header>
  <strong>ODIN Interface — V03.121.0</strong>
  <div><span class="badge">UA</span> <span class="badge">EN</span> <span class="badge">DE</span> <button class="record-action" id="quickSettings">Quick Settings</button></div>
</header>
<main>
<section class="zone-card">
<h1 class="zone-title">🧠 Unified Data Model Schema v1</h1>
<p>Єдина схема для modules, records, gates, locks, checks, actions і nextStep. Це перехід від UI-first логіки до DATA-FIRST системи.</p>
<div class="record-actions">
<button class="record-action" id="buildSchema">Build Schema</button>
<button class="record-action" id="copySchema">Copy Schema</button>
<button class="record-action" id="copySchemaSummary">Copy Schema Summary</button>
</div>
<textarea id="schemaBox" readonly></textarea>
<div class="system-panel" id="schemaStatus">Schema ще не сформована.</div>
</section>
</main>
<script>
const unifiedSchema = {"meta": {"system": "ODIN Interface", "module": "Data Model", "version": "V03.121.0", "type": "UNIFIED_DATA_MODEL_SCHEMA_v1"}, "coreTypes": {"module": {"required": ["id", "name", "type", "status", "path", "ownerLayer", "description", "rules", "nextStep"], "statusEnum": ["ACTIVE", "LOCKED", "CONDITIONAL", "TEMPORARY_REVIEW", "BLOCKED", "DEPRECATED"]}, "record": {"required": ["id", "type", "title", "status", "priority", "createdAt", "source", "payload"]}, "gate": {"required": ["id", "name", "status", "checks", "failed", "rules", "nextStep"], "statusEnum": ["PASSED", "FAILED", "BLOCKED", "READY", "NEEDS_REVIEW"]}, "lock": {"required": ["id", "name", "status", "checks", "lockedRules", "blockedActions", "nextStep"], "statusEnum": ["LOCKED", "BLOCKED", "CONDITIONAL"]}, "check": {"required": ["id", "name", "pass", "details"]}, "action": {"required": ["id", "label", "type", "allowed", "safety", "output", "nextStep"]}}, "unifiedRecordShape": {"id": "string", "type": "module | record | gate | lock | check | action | route | snapshot", "title": "string", "status": "string", "priority": "CRITICAL | HIGH | NORMAL | LOW", "createdAt": "ISO datetime", "updatedAt": "ISO datetime | null", "source": {"layer": "string", "module": "string", "path": "string"}, "checks": [], "rules": [], "blockedActions": [], "payload": {}, "nextStep": "string"}, "safetyRules": ["No automatic restore.", "No automatic git execution.", "No automatic git staging.", "No automatic file write.", "No automatic file deletion.", "Every package must include README / CHANGELOG / MANIFEST / QA_REPORT.", "Do not break V03.100 locked base.", "Do not remove Quick Settings language switch."], "migrationTargets": ["Module Registry", "Cleanup Map", "Temporary Module Plan", "Temporary Module Gate", "Commit Builder Integration", "Action Queue", "Recovery / Continuity locks", "UI Matrix audits"], "nextStep": "Prepare Data Model Schema Validator v1."};
function buildSchema(){
  document.getElementById("schemaBox").value = JSON.stringify(unifiedSchema,null,2);
  document.getElementById("schemaStatus").innerHTML =
    "<strong>Status:</strong> UNIFIED_SCHEMA_READY<br><strong>Core types:</strong> " +
    Object.keys(unifiedSchema.coreTypes).length +
    "<br><strong>Next:</strong> " + unifiedSchema.nextStep;
  return unifiedSchema;
}
async function copyText(t,msg){
  try{await navigator.clipboard.writeText(t); document.getElementById("schemaStatus").innerHTML += "<br>"+msg;}
  catch(e){document.getElementById("schemaStatus").innerHTML += "<br>Copy failed: "+e.message;}
}
function copySchema(){copyText(JSON.stringify(buildSchema(),null,2),"Schema copied.");}
function copySchemaSummary(){
  const s=buildSchema();
  copyText([
    "ODIN V03.121 — Unified Data Model Schema v1",
    "Core types: "+Object.keys(s.coreTypes).join(", "),
    "Migration targets: "+s.migrationTargets.join("; "),
    "Next: "+s.nextStep
  ].join("\n"),"Schema summary copied.");
}
buildSchema();
document.getElementById("buildSchema").addEventListener("click",buildSchema);
document.getElementById("copySchema").addEventListener("click",copySchema);
document.getElementById("copySchemaSummary").addEventListener("click",copySchemaSummary);
</script>
</body>
</html>
