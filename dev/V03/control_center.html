<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ODIN V03.122 — Data Model Schema Validator</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f6f8fb;color:#111827}
header{padding:20px 28px;background:white;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
main{padding:24px;display:grid;gap:16px}
.zone-card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(15,23,42,.06)}
.zone-title{margin:0 0 8px;font-size:20px}
.record-actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.record-action{border:1px solid #cbd5e1;background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}
.system-panel, textarea{width:100%;box-sizing:border-box;border:1px solid #e5e7eb;border-radius:14px;background:#f8fafc;padding:14px;margin-top:10px}
textarea{min-height:300px;font-family:ui-monospace,Consolas,monospace}
.badge{padding:6px 10px;border-radius:999px;background:#eef2ff}
.pass{color:#166534} .fail{color:#991b1b}
</style>
</head>
<body>
<header>
  <strong>ODIN Interface — V03.122.0</strong>
  <div><span class="badge">UA</span> <span class="badge">EN</span> <span class="badge">DE</span> <button class="record-action" id="quickSettings">Quick Settings</button></div>
</header>
<main>
<section class="zone-card">
<h1 class="zone-title">🧪 Data Model Schema Validator v1</h1>
<p>Перевіряє Unified Data Model Schema перед тим, як використовувати її як основу системи.</p>
<div class="record-actions">
<button class="record-action" id="runValidator">Run Schema Validator</button>
<button class="record-action" id="copyValidation">Copy Validation Report</button>
<button class="record-action" id="copyValidator">Copy Validator JSON</button>
</div>
<textarea id="validationBox" readonly></textarea>
<div class="system-panel" id="validationStatus">Validator ще не запускався.</div>
</section>
</main>
<script>
const unifiedSchema = {"meta": {"system": "ODIN Interface", "module": "Data Model", "version": "V03.121.0", "type": "UNIFIED_DATA_MODEL_SCHEMA_v1"}, "coreTypes": {"module": {"required": ["id", "name", "type", "status", "path", "ownerLayer", "description", "rules", "nextStep"], "statusEnum": ["ACTIVE", "LOCKED", "CONDITIONAL", "TEMPORARY_REVIEW", "BLOCKED", "DEPRECATED"]}, "record": {"required": ["id", "type", "title", "status", "priority", "createdAt", "source", "payload"]}, "gate": {"required": ["id", "name", "status", "checks", "failed", "rules", "nextStep"], "statusEnum": ["PASSED", "FAILED", "BLOCKED", "READY", "NEEDS_REVIEW"]}, "lock": {"required": ["id", "name", "status", "checks", "lockedRules", "blockedActions", "nextStep"], "statusEnum": ["LOCKED", "BLOCKED", "CONDITIONAL"]}, "check": {"required": ["id", "name", "pass", "details"]}, "action": {"required": ["id", "label", "type", "allowed", "safety", "output", "nextStep"]}}, "unifiedRecordShape": {"id": "string", "type": "module | record | gate | lock | check | action | route | snapshot", "title": "string", "status": "string", "priority": "CRITICAL | HIGH | NORMAL | LOW", "createdAt": "ISO datetime", "updatedAt": "ISO datetime | null", "source": {"layer": "string", "module": "string", "path": "string"}, "checks": [], "rules": [], "blockedActions": [], "payload": {}, "nextStep": "string"}, "safetyRules": ["No automatic restore.", "No automatic git execution.", "No automatic git staging.", "No automatic file write.", "No automatic file deletion.", "Every package must include README / CHANGELOG / MANIFEST / QA_REPORT.", "Do not break V03.100 locked base.", "Do not remove Quick Settings language switch."], "migrationTargets": ["Module Registry", "Cleanup Map", "Temporary Module Plan", "Temporary Module Gate", "Commit Builder Integration", "Action Queue", "Recovery / Continuity locks", "UI Matrix audits"], "nextStep": "Prepare Data Model Schema Validator v1."};
const validator = {"meta": {"system": "ODIN Interface", "module": "Data Model", "version": "V03.122.0", "type": "DATA_MODEL_SCHEMA_VALIDATOR_v1"}, "validationRules": [{"id": "DMV-001", "name": "meta exists", "target": "meta"}, {"id": "DMV-002", "name": "coreTypes exists", "target": "coreTypes"}, {"id": "DMV-003", "name": "module type exists", "target": "coreTypes.module"}, {"id": "DMV-004", "name": "record type exists", "target": "coreTypes.record"}, {"id": "DMV-005", "name": "gate type exists", "target": "coreTypes.gate"}, {"id": "DMV-006", "name": "lock type exists", "target": "coreTypes.lock"}, {"id": "DMV-007", "name": "check type exists", "target": "coreTypes.check"}, {"id": "DMV-008", "name": "action type exists", "target": "coreTypes.action"}, {"id": "DMV-009", "name": "unifiedRecordShape exists", "target": "unifiedRecordShape"}, {"id": "DMV-010", "name": "safetyRules exist", "target": "safetyRules"}, {"id": "DMV-011", "name": "migrationTargets exist", "target": "migrationTargets"}, {"id": "DMV-012", "name": "nextStep exists", "target": "nextStep"}], "requiredCoreTypes": ["module", "record", "gate", "lock", "check", "action"], "requiredSafetyRules": ["No automatic restore.", "No automatic git execution.", "No automatic git staging.", "No automatic file write.", "No automatic file deletion."], "statusEnum": ["SCHEMA_VALID", "SCHEMA_INVALID"], "nextStep": "Prepare Data Model Registry Migration Map v1."};
let validationReport = {status:"NOT_RUN",checks:[]};

function hasPath(obj,path){
  return path.split(".").reduce((acc,key)=>acc && acc[key]!==undefined ? acc[key] : undefined,obj)!==undefined;
}
function runValidator(){
  const checks = validator.validationRules.map(rule=>({
    id:rule.id,
    name:rule.name,
    pass:hasPath(unifiedSchema,rule.target),
    details:rule.target
  }));
  validator.requiredCoreTypes.forEach(t=>checks.push({
    id:"DMV-CORE-"+t.toUpperCase(),
    name:"required core type: "+t,
    pass:!!unifiedSchema.coreTypes?.[t],
    details:t
  }));
  validator.requiredSafetyRules.forEach((r,i)=>checks.push({
    id:"DMV-SAFE-"+String(i+1).padStart(2,"0"),
    name:"required safety rule",
    pass:(unifiedSchema.safetyRules||[]).includes(r),
    details:r
  }));
  checks.push({
    id:"DMV-MIGRATION-TARGETS",
    name:"migration targets >= 5",
    pass:Array.isArray(unifiedSchema.migrationTargets)&&unifiedSchema.migrationTargets.length>=5,
    details:"targets="+(unifiedSchema.migrationTargets||[]).length
  });
  const failed=checks.filter(c=>!c.pass);
  validationReport={
    meta:{system:"ODIN Interface",module:"Data Model",version:"V03.122.0",type:"DATA_MODEL_SCHEMA_VALIDATION_REPORT_v1",created:new Date().toISOString()},
    status:failed.length?"SCHEMA_INVALID":"SCHEMA_VALID",
    checks,
    failed,
    sourceSchema:unifiedSchema.meta,
    nextStep:failed.length?"Fix schema before registry migration.":"Prepare Data Model Registry Migration Map v1."
  };
  document.getElementById("validationBox").value=JSON.stringify(validationReport,null,2);
  document.getElementById("validationStatus").innerHTML =
    "<strong>Status:</strong> "+validationReport.status+
    "<br><strong>Checks:</strong> "+checks.length+
    "<br><strong>Failed:</strong> "+failed.length+
    "<br><strong>Next:</strong> "+validationReport.nextStep;
  return validationReport;
}
async function copyText(t,msg){
  try{await navigator.clipboard.writeText(t); document.getElementById("validationStatus").innerHTML += "<br>"+msg;}
  catch(e){document.getElementById("validationStatus").innerHTML += "<br>Copy failed: "+e.message;}
}
function copyValidation(){copyText(JSON.stringify(validationReport.status==="NOT_RUN"?runValidator():validationReport,null,2),"Validation copied.");}
function copyValidator(){copyText(JSON.stringify(validator,null,2),"Validator JSON copied.");}
document.getElementById("runValidator").addEventListener("click",runValidator);
document.getElementById("copyValidation").addEventListener("click",copyValidation);
document.getElementById("copyValidator").addEventListener("click",copyValidator);
runValidator();
</script>
</body>
</html>
